baseURL = "https://sylversk40.github.io/"
title = "SylverThreads"
theme = "PaperMod"
languageCode = "en-us"

# A portfolio site does not need RSS.
disableKinds = ["RSS"]

[params]
  description = "SylverThreads | Penetration Testing, Web Application Security and Cybersecurity"
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true

  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon.svg"
    favicon32x32 = "/favicon.svg"

  [params.profileMode]
    enabled = true
    title = "SylverThreads"
    subtitle = "Sylvester St. Juste | Penetration Tester\nOffensive Security • Web Application Pentesting • Bug Bounty Research"

    [[params.profileMode.buttons]]
      name = "About"
      url = "/about/"

    [[params.profileMode.buttons]]
      name = "Certifications"
      url = "/certifications/"

    [[params.profileMode.buttons]]
      name = "Hack The Box"
      url = "https://profile.hackthebox.com/profile/019c733a-f9ea-7351-a422-98f61bfdd333"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/SylverSK40"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/sylversk40/"

[menu]
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 10

  [[menu.main]]
    name = "Certifications"
    url = "/certifications/"
    weight = 20
